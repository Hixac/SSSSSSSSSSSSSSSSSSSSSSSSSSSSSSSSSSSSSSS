services:

  manys-database:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports: 
      - "${POSTGRES_PORT}:5432"
    command: ["postgres", "-N", "1000"]

  telegram-bot-api:
    image: aiogram/telegram-bot-api
    container_name: telegram-bot-api
    restart: unless-stopped
    ports:
      - "${TELEGRAM_BOT_API_PORT}:${TELEGRAM_BOT_API_PORT}"
    volumes:
      - aiogram-data:/var/lib/telegram-bot-api
    environment:
      - TELEGRAM_API_ID=${TG_BOT_API_ID}
      - TELEGRAM_API_HASH=${TG_BOT_API_HASH}

volumes:
  aiogram-data:
